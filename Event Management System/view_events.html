<!DOCTYPE html>
<html>
<head>
    <title>View Registrations</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">All Event Registrations</h2>

    <!-- 🔥 PDF BUTTON HERE -->
    <div class="text-end mb-3">
        <a href="/export_pdf" class="btn btn-danger">Download PDF 📄</a>
    </div>

    <table class="table table-bordered table-striped text-center">
        <thead class="table-dark">
        <tr>
            <th>Event</th>
            <th>Date</th>
            <th>Time</th>
            <th>Venue</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Year</th>
            <th>Phone</th>
        </tr>
        </thead>

        <tbody>
        {% for e in events %}
        <tr>
            <td>{{ e.event_name }}</td>
            <td>{{ e.date }}</td>
            <td>{{ e.time }}</td>
            <td>{{ e.venue }}</td>
            <td>{{ e.participant }}</td>
            <td>{{ e.email }}</td>
            <td>{{ e.department }}</td>
            <td>{{ e.year }}</td>
            <td>{{ e.phone }}</td>
        </tr>
        {% endfor %}
        </tbody>

    </table>

</div>

</body>
</html>
