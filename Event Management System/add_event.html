<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
<div class="card p-4">
<h3>Add Event</h3>

<form method="POST" action="/add_event">
<input class="form-control mb-2" name="name" placeholder="Event Name">
<input class="form-control mb-2" type="date" name="date">
<input class="form-control mb-2" type="time" name="time">
<input class="form-control mb-3" name="venue" placeholder="Venue">
<button class="btn btn-primary">Add Event</button>
</form>

</div>
</div>

</body>
</html>
