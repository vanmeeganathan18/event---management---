<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#121212; color:white; }
.card:hover { transform:scale(1.05); transition:0.3s; }
</style>
</head>

<body>

<div class="container mt-5 text-center">
    <h2 class="mb-5">Dashboard</h2>

    <div class="row">

        <div class="col-md-4">
            <div class="card p-4">
                <h3>➕</h3>
                <h5>Add Event</h5>
                <a href="/add_event_page" class="btn btn-primary mt-2">Open</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4">
                <h3>👥</h3>
                <h5>User Page</h5>
                <a href="/user" class="btn btn-success mt-2">Open</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4">
                <h3>📊</h3>
                <h5>View Data</h5>
                <a href="/view_events" class="btn btn-danger mt-2">Open</a>
            </div>
        </div>

    </div>
</div>

</body>
</html>
