<!DOCTYPE html>
<html>
<head>
    <title>Success</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: black;
            overflow: hidden;
        }

        .popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 255, 150, 0.1);
            border: 2px solid #00ff99;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #00ff99;
            animation: pop 0.5s ease forwards;
        }

        @keyframes pop {
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .tick {
            font-size: 60px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .btn-home {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="popup">
    <div class="tick">✅</div>
    <h2>Registered Successfully!</h2>
    <p>Email Sent 📧</p>

    <a href="/user" class="btn btn-success btn-home">Back to Events</a>
</div>

</body>
</html>
