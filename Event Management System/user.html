<!DOCTYPE html>
<html>
<head>
<title>Events</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">

<h2 class="text-center mb-4">🎉 Register Events</h2>

{% for e in events %}
<div class="card p-4 mb-3">

<h4>{{ e.name }}</h4>
<p>{{ e.date }} | {{ e.time }} | {{ e.venue }}</p>

<form method="POST" action="/user_register">
<input type="hidden" name="event_id" value="{{ e.id }}">

<div class="row">
<div class="col"><input name="name" class="form-control mb-2" placeholder="Name"></div>
<div class="col"><input name="email" class="form-control mb-2" placeholder="Email"></div>
</div>

<div class="row">
<div class="col"><input name="dept" class="form-control mb-2" placeholder="Department"></div>
<div class="col"><input name="year" class="form-control mb-2" placeholder="Year"></div>
</div>

<input name="phone" class="form-control mb-2" placeholder="Phone">

<button class="btn btn-primary">Register</button>

</form>
</div>
{% endfor %}

</div>

</body>
</html>
